org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Allow Foojay resolver to download JDK 17 for flutter_callkit_incoming toolchain.
org.gradle.java.installations.auto-download=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Optional: pin JDK used by Gradle. Leave commented so other machines
# can use ANDROID Studio JBR / JAVA_HOME automatically.
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
#
# Android Studio 2024.3 max AGP is 8.9.0; Flutter 3.47.5 prefers AGP 8.11.1+.
# Keep AGP at 8.9.0 for IDE sync, and skip Flutter's hard check so builds still run.
skipDependencyChecks=true
flutter.source=..
flutter.target=lib/main.dart
# Prefer arm64-only release/APK builds on Windows (avoids 32-bit gen_snapshot issues).
# Remove this line if you need multi-ABI APKs.
target-platform=android-arm64
